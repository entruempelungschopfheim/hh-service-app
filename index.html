<!doctype html>
<html lang="de">
  <head><link rel="apple-touch-icon" href="3E669E7F-F832-4DD4-BBD1-EBF63F66A07F.PNG">
<link rel="icon" type="image/png" href="3E669E7F-F832-4DD4-BBD1-EBF63F66A07F.PNG">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H&H Service - Entrümpelung & App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      h1 { color: #0056b3; font-size: 24px; }
      label { display: block; margin-top: 15px; font-weight: bold; }
      input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background-color: #0056b3;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        margin-top: 20px;
      }
      button:hover { background-color: #004494; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>H&H Service App</h1>
      <p>Digitale Anfrage für Entrümpelungen & Haushaltsauflösungen.</p>
      
      <form onsubmit="sendToWhatsApp(event)">
        <label for="name">Ihr Name / Firma:</label>
        <input type="text" id="name" placeholder="Max Mustermann" required>

        <label for="phone">Telefonnummer für Rückruf:</label>
        <input type="tel" id="phone" placeholder="0176 12345678" required>

        <label for="object-type">Art des Objekts:</label>
        <select id="object-type">
          <option value="Wohnung / Haus">Wohnung / Haus</option>
          <option value="Keller / Dachboden">Keller / Dachboden</option>
          <option value="Gewerbe / Büro">Gewerbe / Büro</option>
        </select>

        <label for="photos">Fotos vom Zustand (optional):</label>
        <input type="file" id="photos" accept="image/*" multiple>

        <button type="submit">Anfrage via WhatsApp senden</button>
      </form>
    </div>

    <script>
      function sendToWhatsApp(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const objectType = document.getElementById('object-type').value;
        
        const myPhoneNumber = "4915731154945"; 
        
        const message = `Neue Entrümpelungs-Anfrage:%0A- Name: ${name}%0A- Telefon: ${phone}%0A- Objekt: ${objectType}`;
        
        window.open(`https://wa.me/${myPhoneNumber}?text=${message}`, '_blank');
      }
    </script>
  </body>
</html>
